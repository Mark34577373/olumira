<label for="insight-period">Date range<select id="insight-period" name="period">{% for value,label in [('7','Last 7 days'),('30','Last 30 days'),('90','Last 90 days'),('custom','Custom range')] %}<option value="{{ value }}" {% if values.period==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
{% for key,label in [('from','From date'),('to','Through date')] %}<label for="insight-{{ key }}">{{ label }}<input id="insight-{{ key }}" name="{{ key }}" type="date" value="{{ values[key] }}"></label>{% endfor %}
<label for="insight-zone">Timezone<input id="insight-zone" name="timezone" maxlength="64" value="{{ values.timezone }}" required></label>
<label for="insight-grouping">Trend grouping<select id="insight-grouping" name="grouping">{% for value in ['daily','weekly'] %}<option {% if values.grouping==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
<label for="insight-category">Observation category<select id="insight-category" name="category"><option value="">All categories</option>{% for category in categories %}<option {% if values.category==category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label>
