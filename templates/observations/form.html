<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% for key in ['scope_workspace','profile_id','version'] %}<input type="hidden" name="{{ key }}" value="{{ form_values[key] }}">{% endfor %}
{% for k,v in back|default({})|items %}<input type="hidden" name="back_{{ k }}" value="{{ v }}">{% endfor %}
<p>Care profile: <strong>{{ g.profile.display_name if g.profile else 'Workspace-wide journal' }}</strong>. Switch the care profile above before opening a form.</p>
<div class="journal-form-grid">
<label for="observation-activity">Title (required)<input id="observation-activity" name="activity" value="{{ form_values.activity }}" maxlength="120" required></label>
<label for="observation-category">Category<input id="observation-category" name="category" list="journal-categories" value="{{ form_values.category }}" maxlength="60" required><datalist id="journal-categories">{% for category in categories %}<option value="{{ category }}">{% endfor %}</datalist></label>
<label for="observation-date">Observation date (required)<input id="observation-date" type="date" name="date" value="{{ form_values.date }}" required></label>
<label for="observation-time">Observation time (optional)<input id="observation-time" type="time" step="1" name="time" value="{{ form_values.time }}"><small>Leave blank if the time is unknown. Repeated daylight-saving clock times use the first occurrence.</small></label>
<label for="observation-zone">Timezone<input id="observation-zone" name="timezone" value="{{ form_values.timezone }}" maxlength="64" required></label>
<label for="observation-mood">Mood (optional)<input id="observation-mood" name="mood" value="{{ form_values.mood }}" maxlength="20" list="journal-moods"><datalist id="journal-moods">{% for mood in ['Happy','Calm','Excited','Frustrated','Sad','Tired','Other'] %}<option value="{{ mood }}">{% endfor %}</datalist></label>
<label class="journal-wide" for="observation-notes">Description<textarea id="observation-notes" name="notes" maxlength="2000" rows="5">{{ form_values.notes }}</textarea></label>
<label class="journal-wide" for="observation-tags">Tags (optional)<input id="observation-tags" name="tags" maxlength="120" value="{{ form_values.tags }}" placeholder="independent, morning"><small>Up to 10 comma-separated tags. Tags are stored in lowercase.</small></label>
<label for="observation-session">Related guided routine (optional)<select id="observation-session" name="session_id"><option value="">None</option>{% for run in choices.sessions %}<option value="{{ run.id }}" {% if form_values.session_id==run.id %}selected{% endif %}>{{ run.title }} · {{ journal_stamp(run.started_at) }}</option>{% endfor %}</select><small>100 most recent sessions in the current profile.</small></label>
<label for="observation-task">Related task (optional)<select id="observation-task" name="task_id"><option value="">None</option>{% for task in choices.tasks %}<option value="{{ task.id }}" {% if form_values.task_id==task.id %}selected{% endif %}>{{ task.title }}</option>{% endfor %}</select><small>100 most recent tasks in the current profile.</small></label>
</div><div class="journal-actions"><button class="routine-button" id="observation-save-button">{{ 'Save changes' if observation|default(None) else 'Save observation' }}</button><a class="text-link" href="{{ journal_link('observations.timeline') }}">Cancel</a></div>
