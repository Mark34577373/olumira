{% set n=card_number|default(1) %}<article class="board-card-editor" data-card-editor><input type="hidden" name="card_id" value="{{ card.id }}"><header><strong data-card-number>Card {{ n }}</strong><button type="button" class="board-drag-handle" aria-label="Drag card {{ n }}" tabindex="-1" hidden>⠿</button></header><div class="board-edit-visual tone-{{ card.color }}" data-card-visual>{{ symbol(card.symbol) }}<strong data-card-label>{{ card.label or 'Your card' }}</strong></div><label data-for="label" for="card-{{ n }}-label">Display label</label><input id="card-{{ n }}-label" name="card_label" value="{{ card.label }}" maxlength="60" required><label data-for="spoken_text" for="card-{{ n }}-spoken_text">Spoken words</label><input id="card-{{ n }}-spoken_text" name="card_spoken_text" value="{{ card.spoken_text }}" maxlength="200" required><details{% if not card.label %} open{% endif %}><summary>Picture &amp; color</summary><label data-for="symbol" for="card-{{ n }}-symbol">Picture</label><select id="card-{{ n }}-symbol" name="card_symbol">{% for category,choices in symbols.items()|groupby('1.1') %}<optgroup label="{{ category }}">{% for key,label in choices %}<option value="{{ key }}"{% if card.symbol==key %} selected{% endif %}>{{ label[0] }}</option>{% endfor %}</optgroup>{% endfor %}</select><label data-for="color" for="card-{{ n }}-color">Color</label><select id="card-{{ n }}-color" name="card_color">{% for key,label in colors.items() %}<option value="{{ key }}"{% if card.color==key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></details><div class="board-card-actions">{% for key,label in [('up','↑ Move up'),('down','↓ Move down'),('copy','Duplicate'),('remove','Remove')] %}<button class="text-button" type="submit" name="editor_action" value="{{ key }}:{{ n-1 }}" data-card-action="{{ key }}" formnovalidate>{{ label }}<span class="visually-hidden"> card {{ n }}</span></button>{% endfor %}</div></article>
