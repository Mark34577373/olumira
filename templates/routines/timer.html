{% if current.timer_seconds %}<section class="local-step-timer" data-local-timer="{{ current.timer_seconds }}" aria-label="Optional step timer"><p>Optional time guide · {{ current.timer_seconds }} seconds</p><output data-timer-output aria-label="Time remaining">{{ current.timer_seconds }}s</output><div class="journal-actions"><button type="button" data-timer-action="start">Start / resume timer</button><button type="button" data-timer-action="pause">Pause timer</button><button type="button" data-timer-action="reset">Reset timer</button></div><p data-timer-status role="status">Timer is optional. Completing it never completes a routine step. Leaving this page resets this local timer.</p></section>{% endif %}
