{% set n=step_number|default(1) %}<div class="routine-step-editor" data-step-editor><input type="hidden" name="step_id" value="{{ step.id }}"><div class="step-editor-header"><span class="step-number" data-step-number>{{ n }}</span><span class="step-header-icon" aria-hidden="true">{{ icon(step.icon) }}</span><h3 data-step-heading>Step {{ n }}</h3><button type="button" class="step-drag-handle" tabindex="-1" aria-label="Drag to reorder step" aria-describedby="step-order-help" hidden>⠿</button></div><div class="workspace-form"><label data-for="title" for="step-{{ n }}-title">Step title</label><input id="step-{{ n }}-title" name="step_title" required maxlength="80" value="{{ step.title }}" placeholder="e.g., Choose a story"></div><details class="step-extras" {% if step.description %}open{% endif %}><summary>Instructions &amp; icon <span class="auth-hint">Optional</span></summary><div class="workspace-form"><label data-for="description" for="step-{{ n }}-description">Instructions <span class="auth-hint">Up to 500 characters</span></label><textarea id="step-{{ n }}-description" name="step_description" maxlength="500" rows="2">{{ step.description }}</textarea><label data-for="icon" for="step-{{ n }}-icon">Step icon</label><select id="step-{{ n }}-icon" name="step_icon">{% for key,label in icons.items() %}<option value="{{ key }}" {% if step.icon==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></details><div class="step-editor-actions"><button type="submit" name="builder_action" value="up:{{ n-1 }}" data-step-up formnovalidate {% if n==1 %}disabled{% endif %}>↑ Move up</button><button type="submit" name="builder_action" value="down:{{ n-1 }}" data-step-down formnovalidate {% if n==total_steps|default(1) %}disabled{% endif %}>↓ Move down</button><button type="submit" name="builder_action" value="remove:{{ n-1 }}" data-step-remove formnovalidate {% if total_steps|default(1)==1 %}disabled{% endif %}>Remove<span class="visually-hidden"> step</span></button></div></div>
