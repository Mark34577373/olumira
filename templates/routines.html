{% extends "base.html" %}

{% block title %}Routines | Olumira{% endblock %}

{% block content %}

<div class="page-header">
	<p class="eyebrow">ROUTINES</p>
	<h1>Morning Routine</h1>
	<p>Follow the routine step by step.</p>
</div>

<div class="routine-card">
	{% for routine in routines %}
	<form class="task-form routine-task-form" method="post" action="{{ url_for('toggle_routine_route', routine_id=routine['id']) }}">
		<button type="submit" class="routine-item {% if routine['completed'] %}completed{% endif %}" aria-pressed="{{ 'true' if routine['completed'] else 'false' }}" aria-label="{% if routine['completed'] %}Mark {{ routine['name'] }} incomplete{% else %}Mark {{ routine['name'] }} complete{% endif %}">
			<span class="routine-check" aria-hidden="true">
				{% if routine['completed'] %}✓{% endif %}
			</span>
			<span class="routine-name">{{ routine['name'] }}</span>
		</button>
	</form>
	{% else %}
	<p class="routine-empty">No routines have been added yet.</p>
	{% endfor %}
</div>

{% endblock %}
