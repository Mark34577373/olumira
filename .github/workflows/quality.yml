name: Isolated quality and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olumira_test
          POSTGRES_PASSWORD: fictional-ci-only-password
          POSTGRES_DB: olumira_test
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd="pg_isready -U olumira_test -d olumira_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      PGPASSWORD: fictional-ci-only-password
      TEST_POSTGRES_URL: postgresql+psycopg://olumira_test:fictional-ci-only-password@127.0.0.1:5432/olumira_test
      TEST_POSTGRES_SECURITY_URL: postgresql+psycopg://olumira_test:fictional-ci-only-password@127.0.0.1:5432/olumira_security_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m gunicorn --config gunicorn.conf.py --check-config app:app
      - run: mkdir -p artifacts/day41-42
      - run: psql -h 127.0.0.1 -U olumira_test -d olumira_test -c 'CREATE DATABASE olumira_security_test'
      - run: python -m pytest -q --cov --cov-report=json --cov-report=xml --junitxml=artifacts/day41-42/pytest.xml
      - run: python scripts/check_coverage.py
      - run: python scripts/scan_secrets.py --history
      - run: python -m bandit -r olumira services scripts -ll -f json -o artifacts/day41-42/bandit-ci.json
      - run: python -m pip_audit -r requirements-dev.txt --format json --output artifacts/day41-42/pip-audit-ci.json
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/run_browser_quality.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fictional-quality-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
